<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Result</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="result">
            <p class="result-title">Your Result</p>

            <div class="score-circle">
                <div class="big-score">76</div>
                <p class="of-100">of 100</p>
            </div>

            <h2>Great</h2>
            <p class="result-text">You scored higher than 65% of the people who have taken these tests.</p>
        </div>


        <div class="summary">
            <h3>Summary</h3>

            <div class="item reaction">
                <p>⚡ Reaction</p>
                <p><b>80</b> / 100</p>
            </div>

            <div class="item memory">
                <p>◷ Memory</p>
                <p><b>92</b> / 100</p>
            </div>

            <div class="item verbal">
                <p>◐ Verbal</p>
                <p><b>61</b> / 100</p>
            </div>

            <div class="item visual">
                <p>👁 Visual</p>
                <p><b>73</b> / 100</p>
            </div>

            <button>Continue</button>
        </div>
    </div>

</body>
</html>
